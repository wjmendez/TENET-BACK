services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: certs
      POSTGRES_USER: certs_user
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6380:6380"]
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9002"
    ports:
    - "9100:9000"   
    - "9102:9002"
