services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: certs
      POSTGRES_USER: certs_user
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certs_user -d certs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # Redis escucha en 6379 dentro del contenedor (antes estaba mapeado 6380:6380 y no conectaba)
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3 (MINIO_ENDPOINT)
      - "9001:9001"   # Consola web
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
