<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockcerts Local Verifier</title>
    <script src="https://unpkg.com/@blockcerts/cert-verifier-js@6.33.1/dist/verifier/index.umd.js"></script>
</head>
<body>
    <h1>Blockcerts Local Verifier</h1>
    <textarea id="certInput" rows="20" cols="80" placeholder="Paste your certificate JSON here"></textarea>
    <br>
    <button onclick="verifyCert()">Verify Certificate</button>
    <div id="result"></div>

    <script>
        async function verifyCert() {
            const certJson = JSON.parse(document.getElementById('certInput').value);
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Verifying...';

            try {
                const cert = new window.BlockcertsVerifier.Certificate(certJson);
                await cert.init();
                const result = await cert.verify();
                resultDiv.innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
            } catch (error) {
                resultDiv.innerHTML = '<pre>Error: ' + error.message + '\n' + error.stack + '</pre>';
            }
        }
    </script>
</body>
</html>
